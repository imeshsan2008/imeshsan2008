name: Build IMESH OS Profile & Breakout Engine

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"

jobs:
  build-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Profile OS & Breakout Physics Builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python3 scripts/breakout_engine.py
          python3 scripts/build_profile.py

      - name: Commit updated SVGs & Arcade level data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg docs/contrib.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(os): refresh breakout physics, telemetry & profile SVGs"
            git pull --rebase origin main
            git push origin main
          fi
