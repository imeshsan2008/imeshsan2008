name: Build IMESH OS Profile & Breakout Engine

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"

jobs:
  build-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Pure JS Profile OS & Breakout Physics Builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          node scripts/breakout-engine.mjs --self-test
          node scripts/build-profile.mjs

      - name: Commit updated SVGs & Arcade level data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg assets/contrib.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(os): refresh breakout physics, telemetry & profile SVGs"
            git pull --rebase origin main
            git push origin main
          fi
