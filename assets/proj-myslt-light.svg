  <g transform="translate(22, 48)">
    <rect x="0" y="0" width="44" height="44" rx="4" fill="#F3F5F7" stroke="#D0D7DE" stroke-width="1"/><path d="M 10 30 A 12 12 0 1 1 34 30" fill="none" stroke="#57606A" stroke-width="2"/><path d="M 10 30 A 12 12 0 0 1 28 19" fill="none" stroke="#CC0000" stroke-width="2"/><line x1="22" y1="28" x2="30" y2="18" stroke="#1F2328" stroke-width="1.8"/><circle cx="22" cy="28" r="2.5" fill="#CC0000"/>
  </g>

  <text x="80" y="66" class="sans title">MySLT Tracker</text>
  <text x="80" y="86" class="sans desc">Open-source browser extension &amp; Windows desktop</text>
  <text x="80" y="103" class="sans desc">widget to track SLT broadband usage, add-ons &amp;</text>
  <text x="80" y="120" class="sans desc">billing with 100% local storage &amp; zero tracking.</text>

