    .cat { font-size: 10px; font-weight: 600; letter-spacing: 0.9px; fill: #656D76; }
    .title { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; fill: #1F2328; }
    .desc { font-size: 12px; font-weight: 500; fill: #57606A; }
    .tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.6px; fill: #1F2328; }
    .arrow { font-size: 14px; font-weight: 700; fill: #57606A; }
  </style>

  <rect x="0.5" y="0.5" width="439" height="181" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" />
  <rect x="0.5" y="0.5" width="439" height="32" rx="8" fill="#FFFFFF" />
  <rect x="0.5" y="24" width="439" height="9" fill="#FFFFFF" />
  <line x1="0" y1="33" x2="440" y2="33" stroke="#D0D7DE" stroke-width="1" />

