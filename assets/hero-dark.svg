<svg xmlns="http://www.w3.org/2000/svg" width="900" height="292" viewBox="0 0 900 292" role="img" aria-label="IMESH OS — Imesh Sandeepa, Founder at Vexora IT Solutions">
  <defs>
    <clipPath id="hero-clip-dark">
      <rect x="0.5" y="0.5" width="899" height="291" rx="8" />
    </clipPath>
    <pattern id="hero-grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1B212A" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .sysbar { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #8B949E; }
    .sysbar-hi { font-size: 10px; font-weight: 800; letter-spacing: 1px; fill: #E6EDF3; }
    .name { font-size: 42px; font-weight: 900; letter-spacing: -1.1px; fill: #E6EDF3; }
    .role-txt { font-size: 12px; font-weight: 700; letter-spacing: 1.1px; fill: #E6EDF3; }
    .bio-txt { font-size: 13px; font-weight: 500; fill: #8B949E; }
    .kpi-k { font-size: 9px; font-weight: 700; letter-spacing: 0.9px; fill: #6E7681; }
    .kpi-v { font-size: 16px; font-weight: 800; fill: #E6EDF3; }
    .kpi-va { font-size: 16px; font-weight: 800; fill: #DC2626; }
    .term-cmd { font-size: 10.5px; font-weight: 700; fill: #E6EDF3; }
    .term-k { font-size: 10.5px; font-weight: 700; fill: #DC2626; }
    .term-v { font-size: 10.5px; font-weight: 500; fill: #8B949E; }
    @keyframes blinkSq { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.2; } }
    .pulse { animation: blinkSq 1.4s steps(2, end) infinite; }
    @keyframes r1 { 0%, 30% { opacity: 1; } 33%, 97% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes r2 { 0%, 32% { opacity: 0; } 35%, 63% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes r3 { 0%, 65% { opacity: 0; } 68%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .cycle1 { animation: r1 9s linear infinite; }
    .cycle2 { animation: r2 9s linear infinite; opacity: 0; }
    .cycle3 { animation: r3 9s linear infinite; opacity: 0; }
  </style>

  <g clip-path="url(#hero-clip-dark)">
    <rect x="0" y="0" width="900" height="292" fill="#0D1117" />
    <rect x="0" y="34" width="548" height="258" fill="url(#hero-grid-dark)" opacity="0.65" />
    <rect x="0" y="0" width="900" height="34" fill="#161B22" />
    <line x1="0" y1="34" x2="900" y2="34" stroke="#30363D" stroke-width="1" />
    <rect x="548" y="34" width="352" height="258" fill="#161B22" />
    <line x1="548" y1="34" x2="548" y2="292" stroke="#30363D" stroke-width="1" />
    <rect x="0" y="0" width="5" height="292" fill="#DC2626" />
  </g>

  <rect x="0.5" y="0.5" width="899" height="291" rx="8" fill="none" stroke="#30363D" stroke-width="1" />

  <rect x="20" y="13" width="8" height="8" rx="1" fill="#DC2626" />
  <text x="36" y="21" class="mono sysbar-hi">IMESH // OS v2.6</text>
  <text x="168" y="21" class="mono sysbar">KELANIYA, LK  ·  06°57'N 79°55'E  ·  UTC+5:30</text>
  <rect x="708" y="13" width="6" height="6" rx="1" fill="#DC2626" class="pulse" />
  <text x="721" y="20.5" class="mono sysbar-hi">ONLINE · OPEN TO BUILD</text>

  <text x="30" y="102" class="sans name">IMESH SANDEEPA<tspan fill="#DC2626">.</tspan></text>

  <rect x="30" y="118" width="486" height="28" rx="3" fill="#161B22" stroke="#30363D" stroke-width="1" />
  <rect x="30" y="118" width="3" height="28" fill="#DC2626" />
  <text x="44" y="136" class="mono role-txt cycle1">&gt; FOUNDER @ VEXORA IT SOLUTIONS</text>
  <text x="44" y="136" class="mono role-txt cycle2">&gt; FULL-STACK ENGINEER · SAAS &amp; DESKTOP SYSTEMS</text>
  <text x="44" y="136" class="mono role-txt cycle3">&gt; WEB &amp; GRAPHIC DESIGNER · UI ARCHITECTURE</text>

  <text x="30" y="174" class="sans bio-txt">Building scalable SaaS platforms, zero-tracking Chrome extensions,</text>
  <text x="30" y="193" class="sans bio-txt">desktop utilities, and sharp visual systems without noise.</text>

  <g transform="translate(30, 214)">
    <rect x="0" y="0" width="114" height="54" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="12" y="18" class="mono kpi-k">REPOSITORIES</text>
    <text x="12" y="42" class="mono kpi-v">26</text>

    <rect x="124" y="0" width="114" height="54" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="136" y="18" class="mono kpi-k">12M COMMITS</text>
    <text x="136" y="42" class="mono kpi-va">288</text>

    <rect x="248" y="0" width="114" height="54" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="260" y="18" class="mono kpi-k">CODEBASE</text>
    <text x="260" y="42" class="mono kpi-v">4.5 MB</text>

    <rect x="372" y="0" width="114" height="54" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="384" y="18" class="mono kpi-k">SINCE</text>
    <text x="384" y="42" class="mono kpi-v">2022</text>
  </g>

  <rect x="570" y="54" width="308" height="156" rx="4" fill="#090C10" stroke="#30363D" stroke-width="1" />
  <rect x="570" y="54" width="308" height="24" rx="4" fill="#0D1117" />
  <line x1="570" y1="78" x2="878" y2="78" stroke="#30363D" stroke-width="1" />
  <text x="582" y="70" class="mono term-cmd">$ whoami --spec</text>
  <rect x="858" y="62" width="10" height="8" rx="1" fill="#DC2626" class="pulse" />

  <text x="582" y="100" class="mono term-k">org     </text><text x="646" y="100" class="mono term-v">Vexora IT Solutions (Founder)</text>
  <text x="582" y="121" class="mono term-k">focus   </text><text x="646" y="121" class="mono term-v">SaaS · Extensions · Utilities</text>
  <text x="582" y="142" class="mono term-k">code    </text><text x="646" y="142" class="mono term-v">JS · Node · Python · Postgres</text>
  <text x="582" y="163" class="mono term-k">design  </text><text x="646" y="163" class="mono term-v">UI/UX · PS · AI · CorelDRAW</text>
  <text x="582" y="184" class="mono term-k">deploy  </text><text x="646" y="184" class="mono term-v">DigitalOcean · Koyeb · Linux</text>
  <text x="582" y="201" class="mono kpi-k">STATUS: SHIPPING CLEAN SYSTEMS</text>

  <rect x="570" y="222" width="308" height="46" rx="4" fill="#090C10" stroke="#30363D" stroke-width="1" />
  <g transform="translate(584, 232)">
    <rect x="0" y="14" width="5" height="12" rx="1" fill="#DC2626"><animate attributeName="height" values="8;24;12;20;8" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="18;2;14;6;18" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="9" y="6" width="5" height="20" rx="1" fill="#E6EDF3"><animate attributeName="height" values="20;10;24;12;20" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="6;16;2;14;6" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="18" y="10" width="5" height="16" rx="1" fill="#8B949E"><animate attributeName="height" values="14;22;6;18;14" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="12;4;20;8;12" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="27" y="4" width="5" height="22" rx="1" fill="#E6EDF3"><animate attributeName="height" values="22;8;18;24;22" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="4;18;8;2;4" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="36" y="12" width="5" height="14" rx="1" fill="#8B949E"><animate attributeName="height" values="10;20;14;6;10" dur="2.3s" repeatCount="indefinite"/><animate attributeName="y" values="16;6;12;20;16" dur="2.3s" repeatCount="indefinite"/></rect>
    <rect x="45" y="8" width="5" height="18" rx="1" fill="#DC2626"><animate attributeName="height" values="16;6;22;12;16" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="10;20;4;14;10" dur="1.6s" repeatCount="indefinite"/></rect>
  </g>

  <text x="650" y="242" class="mono term-cmd">SIGNAL // ACTIVE</text>
  <text x="650" y="257" class="mono kpi-k">PURE NODE.JS PROFILE ENGINE</text>

  <g transform="translate(850, 245)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#30363D" stroke-width="1" stroke-dasharray="3 3">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite" />
    </circle>
    <rect x="-4" y="-4" width="8" height="8" fill="none" stroke="#E6EDF3" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="14s" repeatCount="indefinite" />
    </rect>
    <rect x="-1.5" y="-1.5" width="3" height="3" fill="#DC2626" />
